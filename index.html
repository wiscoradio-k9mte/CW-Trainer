<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Locked-down CSP for an offline, file://-loaded Electron app: no remote
         anything. 'unsafe-inline' is only granted to style-src, for the small
         inline <style> block below; React's style props go through the CSSOM and
         are not governed by this. No 'unsafe-eval' — the production bundle needs
         none. connect-src 'self' keeps the app from reaching the network at all. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <!-- viewport-fit intentionally left at its default ("auto"), NOT "cover": "cover" asks the
         page to draw under the display cutout/home-indicator, which is only safe once every
         edge-to-edge surface is padded with env(safe-area-inset-*) — this tree has none. "auto"
         insets content out of the cutout automatically, so it's the honest, safe default until
         that padding is designed together with the Capacitor mobile lane's keyboard/no-scroll
         contract and validated on real notched hardware. See CLAUDE.md platform roadmap. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CW Trainer — Wisco Radio Labs</title>
    <style>
      html, body, #root { height: 100%; }
      /* H1: matches S.ground.app (#0D0F13) to eliminate the pre-paint background flash */
      body { margin: 0; background: #0D0F13; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
