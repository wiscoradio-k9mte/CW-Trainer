appId: io.github.wiscoradio_k9mte.CWTrainer
productName: CW Trainer
copyright: Copyright © 2026 Wisco Radio Labs (K9MTE)

directories:
  output: release
  buildResources: build

# Only the bundled renderer (dist/) and the Electron main process ship inside
# the app. Vite has already bundled React and all source, so node_modules is
# not needed at runtime.
files:
  - dist/**/*
  - electron/**/*
  - package.json

linux:
  category: Education
  # No-space slug for the unpacked binary, so the binary, snap name, and launch
  # command all read "wr-cw-trainer" (productName "CW Trainer" would otherwise
  # put spaces in the executable path). "wr-" = Wisco Radio Labs.
  executableName: wr-cw-trainer
  # Keep synopsis under ~78 chars — the Snap store enforces a short summary.
  synopsis: Learn Morse code (CW) the Koch way, with copy practice and a QSO sim
  # DELIBERATELY SHORT AND COUNT-FREE. The canonical, always-current store copy lives
  # in snap/snapcraft.yaml — that is what the Snap Store listing actually shows, and
  # what `snapcraft upload-metadata` pushes. This text is a SECOND hand-maintained copy
  # of the same pitch, and a second copy always drifts: it sat at "a six-rung copy
  # ladder" and a POTA/SOTA/IOTA/ragchew-only QSO list well past 2.4.0, because nothing
  # renders it (`npm run pack` is `electron-builder --dir`, which emits no metadata) and
  # so nothing ever caught it. Only `npm run dist` (deb/AppImage — not a shipped target
  # today) would consume it. Keeping it free of rung counts, drill counts and activity
  # lists is what stops it going stale again; put anything that changes per release in
  # snapcraft.yaml, not here.
  description: |
    CW Trainer by Wisco Radio Labs — learn Morse code (CW) the way hams actually use it, from your first two characters to a full on-air contact. Fully offline. No account, no network, no ads.

    Koch-method character lessons, a copy-practice ladder, sending practice with a live decoder and fist feedback, and a QSO simulator covering ragchew, POTA, SOTA, IOTA, DX and contest contacts — plus cross-session progress tracking, realistic band conditions, and built-in reference guides. Key on screen, with the keyboard, or with your own paddle or straight key through a VBand-style USB adapter.

    Made in the Driftless by Wisco Radio Labs (K9MTE). GPL-3.0 · open source · fully offline.
  desktop:
    entry:
      Name: CW Trainer
      GenericName: Morse Code Trainer
      Comment: Learn Morse code the Koch way
      Categories: Education;HamRadio;
      Keywords: morse;cw;ham;radio;koch;telegraph;amateur;qso;pota;sota;

# The Snap is built with real snapcraft (snap/snapcraft.yaml); this electron-builder
# config exists only to produce the unpacked Electron tree (`npm run pack`) that
# snapcraft then packages.
# electron-builder 26 logs a deprecation suggesting a `snapcraft:` key, but that
# key is not yet accepted by 26.15.5's config schema, so the legacy `snap:` key is
# correct. This build uses the template path (mksquashfs, no snapcraft/LXD needed);
# the snap-template extraction bug it used to hit is patched in app-builder-lib —
# see SNAP-BUILD-NOTES.md at the project root for the full story and the patch.
snap:
  grade: stable
  confinement: strict
  summary: Learn Morse code (CW) the Koch way, with copy practice and a QSO sim
  # Interfaces this app needs: a display, audio output, and graphics. These are
  # the standard electron-builder Snap defaults, minus "network" — the trainer
  # is fully offline. (Snapcraft has no "default" interface; the list must be
  # explicit real interface names.)
  plugs:
    - desktop
    - desktop-legacy
    - home
    - x11
    - wayland
    - unity7
    - browser-support
    - gsettings
    - audio-playback
    - pulseaudio
    - opengl
