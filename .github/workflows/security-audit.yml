# Security Audit — weekly dependency-vulnerability sweep
#
# Runs `npm audit` on a schedule (and on demand). This is the scheduled
# security workflow the brief calls for. Vulnerability coverage is GitHub-native:
# Dependabot (alerts + update PRs), CodeQL (codeql.yml), and dependency-review
# (dependency-review.yml). Snyk was trialed and dropped 2026-06-29 — not used.
#
# ESCALATION MODEL — OPTION C (ratified by Travis, 2026-08-10):
# This workflow used to succeed on a high/critical finding and hand off to a
# custom SMTP escalation email (dawidd6/action-send-mail via a reusable
# notify-escalation.yml). That email NEVER once delivered — the Gmail
# credentials it depended on had gone stale, and the escalate job's first-ever
# fire (run 31376800439, 2026-08-10, after 8 clean runs) failed outright with
# `535-5.7.8 Username and Password not accepted`. A finding could have reached
# high/critical at any point in those 8 runs with a GREEN, silent workflow and
# no signal anywhere — the failure mode of "escalate instead of fail" is that
# the escalation channel itself can silently die.
#
# Travis chose Option C: drop the custom email, rely on GitHub-native
# notifications + the shop's morning CI red-run sweep. GitHub's own email for a
# failed SCHEDULED workflow run was verified delivered 2026-08-10 (04:55 CDT).
# So the design inverts: the RUN ITSELF now fails on high/critical, with a
# loud `::error::` annotation naming the counts. The red X on the schedule IS
# the signal now — do not "fix" this back to succeed-then-escalate; that is
# exactly the shape that just failed silently for two months.
#
# Behaviour:
#   - CLEAN            -> the job passes, silently, same as before.
#   - HIGH/CRITICAL     -> the audit step fails the run (`exit 1`) after
#     printing a `::error::` annotation with the counts and next steps.
#   - MODERATE/LOW only -> does not fail (unchanged threshold).
#
# Owned by the security-engineer.

name: Security Audit

on:
  schedule:
    # Mondays 08:30 UTC — after the Dependabot run so a freshly-bumped lockfile
    # is what gets audited.
    - cron: '30 8 * * 1'
  workflow_dispatch: {}   # let Travis run it on demand from the Actions tab

# Nothing by default. The audit job only reads the repo.
permissions: {}

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node 22
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        # `npm audit --json` exits non-zero when vulns exist, so we guard it
        # with `|| true` and parse the JSON ourselves to classify severity —
        # this step's own exit code is decided below, deliberately, not by
        # npm's. All values used here are integers computed by `node -p`; NO
        # raw audit text is interpolated into a later `run:` or into a
        # workflow expression, so there is no script-injection surface.
        run: |
          set -o pipefail
          npm audit --json > audit.json || true

          # Pull severity counts with node (jq may not be present on the image).
          CRITICAL=$(node -p "try{require('./audit.json').metadata.vulnerabilities.critical||0}catch(e){0}")
          HIGH=$(node -p "try{require('./audit.json').metadata.vulnerabilities.high||0}catch(e){0}")
          MODERATE=$(node -p "try{require('./audit.json').metadata.vulnerabilities.moderate||0}catch(e){0}")
          LOW=$(node -p "try{require('./audit.json').metadata.vulnerabilities.low||0}catch(e){0}")

          echo "npm audit: critical=$CRITICAL high=$HIGH moderate=$MODERATE low=$LOW"

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::npm audit found critical=$CRITICAL high=$HIGH vulnerabilities (moderate=$MODERATE low=$LOW, not counted here). Review the npm-audit-report artifact attached to this run — a Dependabot security-update PR may already be open for one or more of these. Severities below high do not fail this workflow."
            exit 1
          fi

      - name: Upload audit report
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-audit-report
          path: audit.json
          retention-days: 30
          if-no-files-found: warn
